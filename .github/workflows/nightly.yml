name: Nightly non-functional checks

on:
  schedule:
    - cron: '15 2 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install small orchestration dependency set
        run: python -m pip install -r requirements.txt

      - name: Start environment
        run: |
          mkdir -p artifacts/nightly
          docker compose up --detach --build --wait --wait-timeout 180
          python scripts/wait_for_service.py "$BASE_URL/health/ready" --timeout 60

      - name: Run k6 service smoke
        id: k6
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -e BASE_URL="$BASE_URL" \
            -v "$PWD:/work" -w /work \
            grafana/k6:latest run \
            --summary-export=artifacts/nightly/k6-summary.json \
            tests/performance/smoke.js

      - name: Run ZAP baseline
        id: zap
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$BASE_URL" \
            -c tests/security/zap-rules.tsv \
            -i -I \
            -r artifacts/nightly/zap-report.html \
            -J artifacts/nightly/zap-report.json \
            -w artifacts/nightly/zap-report.md

      - name: Collect environment evidence
        if: always()
        run: |
          docker compose ps --all > artifacts/nightly/compose-status.txt
          docker compose logs --no-color > artifacts/nightly/compose.log

      - name: Stop environment
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-evidence-${{ github.run_number }}
          path: artifacts/nightly
          retention-days: 30

      - name: Enforce nightly thresholds
        if: always()
        env:
          K6_RESULT: ${{ steps.k6.outcome }}
          ZAP_RESULT: ${{ steps.zap.outcome }}
        run: |
          printf 'k6=%s\nzap=%s\n' "$K6_RESULT" "$ZAP_RESULT"
          test "$K6_RESULT" = success
          test "$ZAP_RESULT" = success
