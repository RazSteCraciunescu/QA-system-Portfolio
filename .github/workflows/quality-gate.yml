name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-verification:
    name: Static and fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate repository content
        run: python scripts/validate_repository.py

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Static type analysis
        run: mypy app

      - name: Execute fast suites with coverage
        run: |
          mkdir -p artifacts/fast
          python -m pytest -m "unit or component or contract or security" \
            --junitxml=artifacts/fast/junit.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/fast/coverage.xml \
            --cov-report=html:artifacts/fast/htmlcov
          python scripts/generate_test_summary.py \
            artifacts/fast/junit.xml artifacts/fast/summary.md \
            --scope "Unit, component, contract, and security suites"

      - name: Run defensive static checks
        run: |
          bandit -q -r app -f json -o artifacts/fast/bandit.json
          pip-audit --format=json --output=artifacts/fast/dependency-audit.json

      - name: Upload fast-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-verification-${{ github.run_number }}
          path: artifacts/fast
          if-no-files-found: warn
          retention-days: 30

  container-security:
    name: Container security baseline
    needs: fast-verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build application image
        run: |
          mkdir -p artifacts/container
          docker build --tag relayhub:${{ github.sha }} .

      - name: Scan image for fixed high-severity vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: relayhub:${{ github.sha }}
          format: json
          output: artifacts/container/trivy-image.json
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload container-security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-security-${{ github.run_number }}
          path: artifacts/container
          if-no-files-found: warn
          retention-days: 30

  live-environment:
    name: Live integration and acceptance packs
    needs: [fast-verification, container-security]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: http://127.0.0.1:8080
      PARTNER_BASE_URL: http://127.0.0.1:8083
      PARTNER_ADMIN_TOKEN: local-test-token
      RUN_INTEGRATION: '1'
      RUN_UI: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install test runners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          npm install --global newman@6.2.2

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Start clean test environment
        run: |
          mkdir -p artifacts/live
          docker compose down --volumes --remove-orphans || true
          docker compose up --detach --build --wait --wait-timeout 180
          python scripts/wait_for_service.py "$BASE_URL/health/ready" --timeout 60
          python scripts/wait_for_service.py "$PARTNER_BASE_URL/health/ready" --timeout 60

      - name: Execute live integration suite
        id: integration
        continue-on-error: true
        run: |
          python -m pytest -m integration \
            --junitxml=artifacts/live/integration-junit.xml

      - name: Execute Robot acceptance smoke
        id: robot
        continue-on-error: true
        run: |
          robot --outputdir artifacts/live/robot \
            --xunit robot-xunit.xml tests/robot

      - name: Execute Postman regression collection
        id: newman
        continue-on-error: true
        run: |
          newman run tests/postman/relayhub.postman_collection.json \
            --environment tests/postman/relayhub.postman_environment.json \
            --reporters cli,junit \
            --reporter-junit-export artifacts/live/newman-junit.xml

      - name: Execute Playwright dashboard smoke
        id: ui
        continue-on-error: true
        run: |
          python -m pytest -m ui \
            --junitxml=artifacts/live/ui-junit.xml

      - name: Collect service evidence
        if: always()
        run: |
          docker compose ps --all > artifacts/live/compose-status.txt
          docker compose logs --no-color > artifacts/live/compose.log
          docker compose config > artifacts/live/compose-resolved.yaml

      - name: Stop test environment
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload live-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-verification-${{ github.run_number }}
          path: artifacts/live
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce live-test result
        if: always()
        env:
          INTEGRATION_RESULT: ${{ steps.integration.outcome }}
          ROBOT_RESULT: ${{ steps.robot.outcome }}
          NEWMAN_RESULT: ${{ steps.newman.outcome }}
          UI_RESULT: ${{ steps.ui.outcome }}
        run: |
          printf 'integration=%s\nrobot=%s\nnewman=%s\nui=%s\n' \
            "$INTEGRATION_RESULT" "$ROBOT_RESULT" "$NEWMAN_RESULT" "$UI_RESULT"
          test "$INTEGRATION_RESULT" = success
          test "$ROBOT_RESULT" = success
          test "$NEWMAN_RESULT" = success
          test "$UI_RESULT" = success
