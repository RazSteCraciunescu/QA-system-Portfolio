name: Defect report
description: Record a reproducible product or integration failure
title: "[DEFECT] "
labels: [bug, triage]
body:
  - type: input
    id: build
    attributes:
      label: Build or commit
      placeholder: v1.0.0 / commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local Docker Compose
        - Local multi-process fallback
        - CI integration
        - Other controlled environment
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Proposed severity
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: Preconditions and test data
      description: Include scenario settings, IDs, configuration changes, and data references.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Correlation ID, request/response, logs, database query, screenshots, or report paths.
  - type: textarea
    id: impact
    attributes:
      label: Impact and suggested regression scope
    validations:
      required: true
